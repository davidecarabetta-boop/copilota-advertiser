<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Copilota Advertiser{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eaeef2; --line:#d6dde4;
  --fg:#17212b; --muted:#5a6876; --accent:#1d5fd0; --accent-soft:#e3ecfb;
  --ok:#1f7a4d; --ok-soft:#e1f3e8; --warn:#a86200; --warn-soft:#fbf0dc; --bad:#b4232c; --bad-soft:#fbe4e5;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#161d25; --sunk:#1c252f; --line:#2a3541;
  --fg:#e4eaf0; --muted:#93a1af; --accent:#6ea2ff; --accent-soft:#1b2c48;
  --ok:#5cc28a; --ok-soft:#14301f; --warn:#e6a54a; --warn-soft:#33260f; --bad:#f07178; --bad-soft:#3a1719; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.top h1{font-size:22px}
.top h1 a{color:inherit;text-decoration:none}
.sub,.muted{color:var(--muted)}
.local{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:18px}
.card h3{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.verde{background:var(--ok-soft);color:var(--ok)} .giallo{background:var(--warn-soft);color:var(--warn)} .rosso{background:var(--bad-soft);color:var(--bad)}
.neutral{background:var(--sunk);color:var(--muted)}
.banner{border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.checks .what{font-weight:500}
.checks .detail{grid-column:2;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:10px;border-radius:6px;white-space:pre-wrap;margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
textarea{width:100%;font-family:var(--f-mono);font-size:12px}
label{display:grid;gap:4px;font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ev{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.ev b{color:var(--fg);font-weight:500}
.matrix td{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="/">Copilota Advertiser</a></h1>
    <span class="local">locale · sola lettura sulle piattaforme</span>
    {% block crumbs %}{% endblock %}
  </header>
  {% block body %}{% endblock %}
</div>
</body>
</html>
